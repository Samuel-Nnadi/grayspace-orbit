name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, payment-gateway, email-service, inventory-service, user-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Grayspace Orbit Release
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-directory: ${{ matrix.service }}
