name: 'Grayspace Orbit'
description: 'Automates semantic versioning, changelog generation, and AI-driven GitHub releases.'
branding:
  icon: 'rocket'
  color: 'gray-dark'
inputs:
  github-token:
    description: 'GitHub Token for authentication'
    required: true
  target-directory:
    description: 'Monorepo support: Directory to track for changes'
    required: false
    default: ''
  webhook-url:
    description: 'Slack/Discord webhook URL for release notifications'
    required: false
    default: ''
  fallback-policy:
    description: 'Policy for non-compliant commits: patch (default), skip, or fail'
    required: false
    default: 'patch'
  gemini-api-key:
    description: 'Optional Gemini API key for AI-driven Business Impact summaries'
    required: false
    default: ''
outputs:
  new-version:
    description: 'The new semantic version generated'
  release-url:
    description: 'URL of the published GitHub release'
runs:
  using: 'docker'
  image: 'Dockerfile'
